services:

  luxdem-frontend:
    command: uvicorn app.dash_app:server  --host 0.0.0.0 --port 80 --reload
    ports:
      - ${dash_app_port:-8050}:80
    volumes:
      - ./tests:/app/tests
    environment:
      environment: nonprod
  luxdem_backend:
    ports:
      - ${app_port:-8000}:80
      - ${jupyter_port:-5000}:5000
    environment:
      environment: nonprod
    command: uvicorn app.app:app --host 0.0.0.0 --port 80 --forwarded-allow-ips='*' --proxy-headers

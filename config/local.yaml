---
app_name: LuxDem

authentication:
  algorithm: HS256
  access_token_expire_minutes: 480 # 8hrs
  secret_key: null

database:
  db_port: 5432
  db_name: null
  db_host: null
  db_username: null
  db_password: null

smtp:
  email_smtp: smtp-mail.outlook.com
  email_port: 587
  email_sender: null
  email_password: null

dash_settings:
  debug: true
  gunicorn_setup: false

api_keys:
  claude: null

ollama:
  embedding_model: snowflake-arctic-embed2  # #52, digest 30685f… on Ollama 0.40.13
  chat_model: qwen3.5:latest  # native Ollama.app on 127.0.0.1:11434, not the luxdem_ollama container
  chat_num_ctx: 32768  # verdict passages ~12k tokens (#101); GPU only
  base_url: http://127.0.0.1:11434  # Docker uses http://ollama:11434
  embedding_keep_alive: 30m  # how long Ollama keeps the embedder loaded; -1 = forever (bulk runs)

chroma:
  # Store under data/: the re-embedded arctic store (#32). Never reuse a collection across models.
  directory: embeddings_v2
  collection: docs

docling:
  accelerator: mps   # auto | cpu | mps
  num_threads: 8

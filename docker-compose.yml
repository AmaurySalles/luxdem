services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:15-alpine
    container_name: luxdem_postgres
    env_file:
      - ./.env
    environment:
      TZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists DB data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== PGADMIN ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: luxdem_pgadmin
    env_file:
      - ./.env
    environment:
      TZ: Europe/Paris
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin # Persists pgAdmin config
    depends_on:
      postgres:
        condition: service_healthy # Wait for DB to be ready
    networks:
      - app-network

  # ==================== OLLAMA ====================
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
      args:
        EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mistral}
    image: luxdem_ollama:latest
    container_name: luxdem_ollama
    env_file:
      - ./.env
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      TZ: Europe/Paris
    ports:
      - "${ollama_port:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped

  # ==================== CHROMA ====================
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: luxdem_chroma
    env_file:
      - ./.env
    environment:
      TZ: Europe/Paris
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data
    networks:
      - app-network

  # ==================== FASTAPI BACKEND ====================
  luxdem_backend:
    image: luxdem:latest
    container_name: luxdem_backend
    restart: always
    env_file:
      - ./.env
    environment:
      TZ: Europe/Paris
    
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./secrets:/app/secrets
      - ./vector_db:/app/vector_db
      - ./data:/app/data
    
    depends_on:
      postgres:
        condition: service_healthy # Wait for DB
      ollama:
        condition: service_started # Wait for Ollama to start
    
    networks:
      - app-network
    
    command: >
      gunicorn app.app:app
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --access-logfile -
      --error-logfile -

  # ==================== DASH FRONTEND ====================
  luxdem-frontend:
    container_name: luxdem_frontend
    image: luxdem:latest
    environment:
      # FastAPI Backend URL (internal service name)
      FASTAPI_URL: http://luxdem_backend:8000
      
      # Other configs
      DASH_ENV: development
      LOG_LEVEL: INFO
      TZ: Europe/Paris
    
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./secrets:/app/secrets
      - ./assets:/app/assets

    depends_on:
      postgres:
        condition: service_healthy # Wait for DB to be ready
    
    networks:
      - app-network
    
    command: >
      python -m gunicorn app.dash_app:server
      --bind 0.0.0.0:8050
      --workers 2
      --worker-class sync
      --timeout 120
      --access-logfile -
      --error-logfile -

networks:
  app-network:
    driver: bridge
    name: app-network

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
  chroma_data:  
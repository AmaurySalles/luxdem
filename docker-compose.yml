services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:15-alpine
    container_name: luxdem_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxdem_password}
      POSTGRES_DB: ${POSTGRES_DB:-luxdem}
      TZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists DB data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== PGADMIN ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: luxdem_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      TZ: Europe/Paris
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin # Persists pgAdmin config
    depends_on:
      postgres:
        condition: service_healthy # Wait for DB to be ready
    networks:
      - app-network

  # ==================== OLLAMA ====================
  ollama:
    image: ollama/ollama:latest
    container_name: luxdem_ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      TZ: Europe/Paris
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama # Persists downloaded models (e.g. mistral, gemini...)
    networks:
      - app-network
    restart: unless-stopped

  # ==================== CHROMA ====================
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: luxdem_chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/data
      TZ: Europe/Paris
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data
    networks:
      - app-network

  # ==================== FASTAPI BACKEND ====================
  luxdem_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxdem_backend
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-luxdem}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-luxdem_password}
      
      # Embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3-large}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

      # Chroma
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-housing_docs_voyage_v1}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
      
      # FastAPI Config
      FASTAPI_ENV: development
      LOG_LEVEL: INFO
      TZ: Europe/Paris
    
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./secrets:/app/secrets
      - ./data:/app/data
    
    depends_on:
      postgres:
        condition: service_healthy # Wait for DB
      chroma:
        condition: service_started # Wait for Chroma to start
    
    networks:
      - app-network
    
    command: >
      gunicorn app.app:app
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
      --access-logfile -
      --error-logfile -

  # ==================== DASH FRONTEND ====================
  luxdem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxdem_frontend
    environment:
      # FastAPI Backend URL (internal service name)
      FASTAPI_URL: http://luxdem_backend:8000
      
      # Other configs
      DASH_ENV: development
      LOG_LEVEL: INFO
      TZ: Europe/Paris
    
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./secrets:/app/secrets
      - ./assets:/app/assets

    depends_on:
      postgres:
        condition: service_healthy # Wait for DB to be ready
    
    networks:
      - app-network
    
    command: >
      python -m gunicorn app.dash_app:server
      --bind 0.0.0.0:8050
      --workers 2
      --worker-class sync
      --timeout 120
      --access-logfile -
      --error-logfile -

networks:
  app-network:
    driver: bridge
    name: app-network

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
  chroma_data:  
